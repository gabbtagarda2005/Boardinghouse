# Netlify: the admin web app + public pages (React + Vite).
# Site settings → Environment variables: see docs/DEPLOYMENT.md (VITE_API_URL, VITE_FIREBASE_*).
[build]
  base = "admin-web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every route (/login, /rooms, /inquire/rooms/…) is served by index.html,
# so refreshing a page never shows "Page not found".
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Built files have content hashes in their names: cache them for a long time.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
